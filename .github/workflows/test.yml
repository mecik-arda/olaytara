name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bagimliliklari kur
        run: pip install -e ".[test]"
      - name: Testleri calistir
        run: python -m unittest discover -s tests -v
      - name: Kod bicimi denetimi
        run: ruff check .
      - name: Ornekler sozlesmeyi tutturuyor mu
        run: python -m olaytara.cli tara ornekler/temiz.md --esik yuksek
      - name: Riskli ornek kural tetikliyor mu
        run: |
          python -m olaytara.cli tara ornekler/riskli.md --esik yuksek || test $? -eq 1